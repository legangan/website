<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甘-计算器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        
        .header {
            text-align: center;
            color: white;
            width: 100%;
        }
        
        .main-title {
            font-size: 4.5rem;
            font-weight: 700;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            letter-spacing: 5px;
            background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }
        
        .main-title::after {
            content: "";
            position: absolute;
            width: 200px;
            height: 5px;
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 5px;
        }
        
        .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            opacity: 0.9;
            margin-top: 20px;
        }
        
        .calculator {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .display {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: right;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .calculation {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            min-height: 25px;
            word-break: break-all;
        }
        
        .result {
            color: white;
            font-size: 2.8rem;
            font-weight: 600;
            word-break: break-all;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 15px;
        }
        
        button {
            border: none;
            border-radius: 12px;
            padding: 20px 0;
            font-size: 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            color: #333;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        button:active {
            transform: translateY(1px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        
        .number, .decimal {
            background-color: #f8f9fa;
        }
        
        .number:hover, .decimal:hover {
            background-color: #e9ecef;
        }
        
        .operator {
            background-color: #ffc107;
            color: #212529;
        }
        
        .operator:hover {
            background-color: #e0a800;
        }
        
        .equals {
            background-color: #28a745;
            color: white;
        }
        
        .equals:hover {
            background-color: #218838;
        }
        
        .clear, .backspace {
            background-color: #dc3545;
            color: white;
        }
        
        .clear:hover, .backspace:hover {
            background-color: #c82333;
        }
        
        .zero {
            grid-column: span 2;
        }
        
        .footer {
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        
        .highlight {
            color: #ffecd2;
            font-weight: bold;
        }
        
        /* 响应式设计 */
        @media (max-width: 600px) {
            .main-title {
                font-size: 3.5rem;
            }
            
            .calculator {
                padding: 20px;
            }
            
            button {
                padding: 18px 0;
                font-size: 1.3rem;
            }
            
            .result {
                font-size: 2.3rem;
            }
        }
        
        @media (max-width: 480px) {
            .main-title {
                font-size: 2.8rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .calculator {
                padding: 15px;
            }
            
            button {
                padding: 15px 0;
                font-size: 1.2rem;
            }
            
            .result {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="main-title">我的</h1>
            <p class="subtitle">智能科学计算器 - 精确、快速、优雅</p>
        </div>
        
        <div class="calculator">
            <div class="display">
                <div class="calculation" id="calculation"></div>
                <div class="result" id="result">0</div>
            </div>
            
            <div class="buttons">
                <button class="clear" data-action="clear">C</button>
                <button class="backspace" data-action="backspace">⌫</button>
                <button class="operator" data-action="percentage">%</button>
                <button class="operator" data-action="divide">÷</button>
                
                <button class="number" data-number="7">7</button>
                <button class="number" data-number="8">8</button>
                <button class="number" data-number="9">9</button>
                <button class="operator" data-action="multiply">×</button>
                
                <button class="number" data-number="4">4</button>
                <button class="number" data-number="5">5</button>
                <button class="number" data-number="6">6</button>
                <button class="operator" data-action="subtract">-</button>
                
                <button class="number" data-number="1">1</button>
                <button class="number" data-number="2">2</button>
                <button class="number" data-number="3">3</button>
                <button class="operator" data-action="add">+</button>
                
                <button class="number zero" data-number="0">0</button>
                <button class="decimal" data-action="decimal">.</button>
                <button class="equals" data-action="equals">=</button>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2027 <span class="highlight">我的计算器</span> | 支持基本运算、百分比计算和连续运算</p>
            <p>使用键盘数字键和运算符也可进行操作</p>
        </div>
    </div>

    <script>
        // 计算器状态
        const calculator = {
            displayValue: '0',
            firstOperand: null,
            waitingForSecondOperand: false,
            operator: null,
            calculationHistory: ''
        };

        // 更新显示
        function updateDisplay() {
            const resultElement = document.getElementById('result');
            const calculationElement = document.getElementById('calculation');
            
            resultElement.textContent = calculator.displayValue;
            calculationElement.textContent = calculator.calculationHistory;
        }

        // 输入数字
        function inputDigit(digit) {
            const { displayValue, waitingForSecondOperand } = calculator;
            
            if (waitingForSecondOperand === true) {
                calculator.displayValue = digit;
                calculator.waitingForSecondOperand = false;
            } else {
                calculator.displayValue = displayValue === '0' ? digit : displayValue + digit;
            }
            
            updateDisplay();
        }

        // 输入小数点
        function inputDecimal() {
            if (calculator.waitingForSecondOperand === true) {
                calculator.displayValue = '0.';
                calculator.waitingForSecondOperand = false;
                return;
            }
            
            if (!calculator.displayValue.includes('.')) {
                calculator.displayValue += '.';
            }
            
            updateDisplay();
        }

        // 处理操作符
        function handleOperator(nextOperator) {
            const { firstOperand, displayValue, operator } = calculator;
            const inputValue = parseFloat(displayValue);
            
            // 更新计算历史
            if (operator && calculator.waitingForSecondOperand) {
                // 如果已经有一个操作符，并且正在等待第二个操作数，则更新操作
            calculator.calculationHistory = calculator.calculationHistory.slice(0, -1) + nextOperator;
            } else {
                calculator.calculationHistory = `${calculator.calculationHistory} ${displayValue} ${nextOperator}`;
            }
            
            if (firstOperand === null && !isNaN(inputValue)) {
                calculator.firstOperand = inputValue;
            } else if (operator) {
                const result = performCalculation();
                calculator.displayValue = `${parseFloat(result.toFixed(7))}`;
                calculator.firstOperand = result;
            }
            
            calculator.waitingForSecondOperand = true;
            calculator.operator = nextOperator;
            
            updateDisplay();
        }

        // 执行计算
        function performCalculation() {
            const { firstOperand, displayValue, operator } = calculator;
            const inputValue = parseFloat(displayValue);
            
            if (isNaN(firstOperand) || isNaN(inputValue)) {
                return 0;
            }
            
            switch (operator) {
                case 'add':
                    return firstOperand + inputValue;
                case 'subtract':
                    return firstOperand - inputValue;
                case 'multiply':
                    return firstOperand * inputValue;
                case 'divide':
                    return firstOperand / inputValue;
                case 'percentage':
                    return firstOperand * (inputValue / 100);
                default:
                    return inputValue;
            }
        }

        // 重置计算器
        function resetCalculator() {
            calculator.displayValue = '0';
            calculator.firstOperand = null;
            calculator.waitingForSecondOperand = false;
            calculator.operator = null;
            calculator.calculationHistory = '';
            updateDisplay();
        }

        // 删除最后一个字符
        function backspace() {
            if (calculator.displayValue.length > 1) {
                calculator.displayValue = calculator.displayValue.slice(0, -1);
            } else {
                calculator.displayValue = '0';
            }
            updateDisplay();
        }

        // 计算百分比
        function calculatePercentage() {
            const currentValue = parseFloat(calculator.displayValue);
            if (!isNaN(currentValue)) {
                calculator.displayValue = (currentValue / 100).toString();
                updateDisplay();
            }
        }

        // 处理等号
        function handleEquals() {
            if (calculator.operator && !calculator.waitingForSecondOperand) {
                const result = performCalculation();
                calculator.displayValue = `${parseFloat(result.toFixed(7))}`;
                calculator.calculationHistory = `${calculator.calculationHistory} ${calculator.displayValue}`;
                calculator.firstOperand = null;
                calculator.waitingForSecondOperand = false;
                calculator.operator = null;
                updateDisplay();
            }
        }

        // 键盘支持
        function handleKeydown(event) {
            const { key } = event;
            
            // 数字键
            if (key >= '0' && key <= '9') {
                event.preventDefault();
                inputDigit(key);
                return;
            }
            
            // 操作符
            switch (key) {
                case '+':
                    event.preventDefault();
                    handleOperator('add');
                    break;
                case '-':
                    event.preventDefault();
                    handleOperator('subtract');
                    break;
                case '*':
                case 'x':
                case 'X':
                    event.preventDefault();
                    handleOperator('multiply');
                    break;
                case '/':
                    event.preventDefault();
                    handleOperator('divide');
                    break;
                case '.':
                case ',':
                    event.preventDefault();
                    inputDecimal();
                    break;
                case 'Enter':
                case '=':
                    event.preventDefault();
                    handleEquals();
                    break;
                case 'Escape':
                case 'Delete':
                    event.preventDefault();
                    resetCalculator();
                    break;
                case 'Backspace':
                    event.preventDefault();
                    backspace();
                    break;
                case '%':
                    event.preventDefault();
                    calculatePercentage();
                    break;
            }
        }

        // 初始化事件监听器
        function initEventListeners() {
            // 按钮点击事件
            document.querySelector('.buttons').addEventListener('click', event => {
                const { target } = event;
                
                if (!target.matches('button')) {
                    return;
                }
                
                if (target.hasAttribute('data-number')) {
                    inputDigit(target.getAttribute('data-number'));
                    return;
                }
                
                if (target.hasAttribute('data-action')) {
                    const action = target.getAttribute('data-action');
                    
                    switch (action) {
                        case 'decimal':
                            inputDecimal();
                            break;
                        case 'clear':
                            resetCalculator();
                            break;
                        case 'backspace':
                            backspace();
                            break;
                        case 'percentage':
                            calculatePercentage();
                            break;
                        case 'equals':
                            handleEquals();
                            break;
                        case 'add':
                        case 'subtract':
                        case 'multiply':
                        case 'divide':
                            handleOperator(action);
                            break;
                    }
                }
            });
            
            // 键盘事件
            document.addEventListener('keydown', handleKeydown);
        }

        // 初始化计算器
        function initCalculator() {
            updateDisplay();
            initEventListeners();
        }

        // 页面加载完成后初始化计算器
        document.addEventListener('DOMContentLoaded', initCalculator);
    </script>
</body>
</html>
