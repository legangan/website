<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>翻页时钟 - 极简全屏时钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免全屏时拖动文字，不影响交互 */
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', 'Courier New', monospace;
            padding: 20px;
            position: relative;
            transition: background 0.2s;
        }

        /* 主容器 - 只有一个时钟 */
        .clock-container {
            background: transparent;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 翻页时钟区域 */
        .flip-display {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 20px 10px;
            transition: all 0.2s;
        }

        /* 单个数字卡片 (翻页风格) */
        .flip-card {
            background: #2c2c2c;  /* 比黑色浅的深灰色，有质感 */
            color: #f0f0f0;
            width: 100px;
            height: 130px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 5.5rem;
            font-weight: 700;
            border-radius: 12px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.1s ease;
            font-family: monospace;
            letter-spacing: 2px;
            /* 模拟轻微翻页立体感 */
            border-bottom: 3px solid #1a1a1a;
            border-right: 1px solid #3a3a3a;
        }

        /* 冒号样式 (独立样式，非卡片) */
        .colon {
            font-size: 5rem;
            font-weight: 700;
            color: #cccccc;
            background: transparent;
            width: auto;
            padding: 0 8px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        /* 右下角全屏按钮 - 默认显示 */
        .fullscreen-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #1e1e1e;
            width: 54px;
            height: 54px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 28px;
            border: 1px solid #444;
            color: #ccc;
            transition: 0.2s;
            backdrop-filter: blur(8px);
            z-index: 1000;
            box-shadow: 0 2px 12px rgba(0,0,0,0.6);
        }
        
        .fullscreen-btn:hover {
            background: #3a3a3a;
            color: white;
            transform: scale(1.03);
        }

        /* 全屏状态时按钮隐藏 */
        .fullscreen-btn.hide-in-fullscreen {
            display: none;
        }

        /* 响应式: 小屏幕下卡片宽度缩小 */
        @media (max-width: 700px) {
            .flip-card {
                width: 65px;
                height: 90px;
                font-size: 3.5rem;
            }
            .colon {
                font-size: 3.5rem;
                padding: 0 3px;
            }
        }
        @media (max-width: 550px) {
            .flip-card {
                width: 52px;
                height: 74px;
                font-size: 2.6rem;
            }
            .colon {
                font-size: 2.6rem;
            }
        }

        /* 可选的极简水印/装饰，完全不影响主体 */
        .clock-sub {
            margin-top: 28px;
            font-size: 13px;
            color: #2a2a2a;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="clock-container">
    <!-- 翻页数字展示区 - 仅当前时间 -->
    <div class="flip-display" id="flipDisplay"></div>
    <div class="clock-sub"></div>
</div>

<div class="fullscreen-btn" id="fullscreenBtn">⛶</div>

<script>
    // ---------- DOM 元素 ----------
    const flipDisplay = document.getElementById('flipDisplay');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    
    // 定时器ID
    let timeInterval = null;
    
    // ---------- 辅助函数: 格式化两位数 ----------
    function pad2(num) {
        return Math.floor(num).toString().padStart(2, '0');
    }
    
    // ---------- 核心: 渲染翻页卡片 (支持时分秒"HH:MM:SS"格式，将冒号单独处理) ----------
    function renderFlipDigits(timeString) {
        // timeString 格式例如 "12:34:56"
        // 拆成字符数组，保留冒号单独样式
        const chars = timeString.split('');
        flipDisplay.innerHTML = '';
        for (let ch of chars) {
            if (ch === ':') {
                const colonSpan = document.createElement('span');
                colonSpan.className = 'colon';
                colonSpan.textContent = ':';
                flipDisplay.appendChild(colonSpan);
            } else {
                const card = document.createElement('div');
                card.className = 'flip-card';
                card.textContent = ch;
                flipDisplay.appendChild(card);
            }
        }
    }
    
    // ---------- 获取当前时间并更新显示 (精确到时分秒) ----------
    function updateCurrentTime() {
        const now = new Date();
        const hours = pad2(now.getHours());
        const minutes = pad2(now.getMinutes());
        const seconds = pad2(now.getSeconds());
        const timeStr = `${hours}:${minutes}:${seconds}`;
        renderFlipDigits(timeStr);
    }
    
    // 启动时钟 (每秒刷新)
    function startClock() {
        if (timeInterval) {
            clearInterval(timeInterval);
        }
        updateCurrentTime(); // 立即刷新一次避免空白
        timeInterval = setInterval(updateCurrentTime, 1000);
    }
    
    // ---------- 全屏逻辑 (进入全屏后按钮隐藏，点击任意空白区域退出全屏，退出全屏后按钮重新出现) ----------
    // 判断当前是否全屏状态 (兼容各浏览器)
    function isFullscreenActive() {
        return !!(document.fullscreenElement || 
                  document.webkitFullscreenElement || 
                  document.mozFullScreenElement ||
                  document.msFullscreenElement);
    }
    
    // 进入全屏
    function enterFullscreen() {
        const elem = document.documentElement;
        const requestMethod = elem.requestFullscreen ||
                              elem.webkitRequestFullscreen ||
                              elem.mozRequestFullScreen ||
                              elem.msRequestFullscreen;
        if (requestMethod) {
            requestMethod.call(elem);
        }
    }
    
    // 退出全屏
    function exitFullscreen() {
        const exitMethod = document.exitFullscreen ||
                           document.webkitExitFullscreen ||
                           document.mozCancelFullScreen ||
                           document.msExitFullscreen;
        if (exitMethod) {
            exitMethod.call(document);
        }
    }
    
    // 更新全屏按钮的显隐状态 (全屏时隐藏，非全屏时显示)
    function updateFullscreenButtonVisibility() {
        if (isFullscreenActive()) {
            fullscreenBtn.classList.add('hide-in-fullscreen');
        } else {
            fullscreenBtn.classList.remove('hide-in-fullscreen');
        }
    }
    
    // 全局点击退出全屏的处理 (在全屏状态下，任意点击空白区域自动退出)
    let fullscreenClickHandler = null;
    
    function setupFullscreenAutoExit() {
        // 监听全屏变化事件，动态添加/移除全局点击监听
        const onFullscreenChange = () => {
            const full = isFullscreenActive();
            // 更新按钮显示/隐藏
            updateFullscreenButtonVisibility();
            
            if (full) {
                // 进入全屏：设置一个全局点击监听，用于退出全屏
                if (!fullscreenClickHandler) {
                    fullscreenClickHandler = function(event) {
                        // 检查是否还在全屏模式中
                        if (isFullscreenActive()) {
                            // 重要：为了避免点击全屏按钮时同时触发退出（按钮已经隐藏，但为防止极端情况）
                            // 另外由于全屏后按钮已经隐藏，用户点击任何空白区域都应退出全屏
                            // 但是需要避免事件冒泡导致误解，这里直接退出全屏
                            exitFullscreen();
                        }
                    };
                    // 注意：使用捕获阶段或者冒泡都可以，但为了确保能捕获所有点击，添加到document
                    document.addEventListener('click', fullscreenClickHandler);
                    // 触摸设备同样适配
                    document.addEventListener('touchstart', fullscreenClickHandler);
                }
            } else {
                // 退出全屏：移除全局点击监听
                if (fullscreenClickHandler) {
                    document.removeEventListener('click', fullscreenClickHandler);
                    document.removeEventListener('touchstart', fullscreenClickHandler);
                    fullscreenClickHandler = null;
                }
            }
        };
        
        // 监听各种全屏变化事件
        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);
        document.addEventListener('mozfullscreenchange', onFullscreenChange);
        document.addEventListener('MSFullscreenChange', onFullscreenChange);
        
        // 初始化调用一次，确保按钮初始状态正确
        onFullscreenChange();
    }
    
    // 全屏按钮点击事件：进入全屏
    function bindFullscreenButton() {
        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', (e) => {
                e.stopPropagation();  // 阻止冒泡，以免触发全屏后的全局退出（但此时还未全屏，无所谓）
                if (!isFullscreenActive()) {
                    enterFullscreen();
                } else {
                    // 如果已经是全屏状态（理论上按钮隐藏了很难点到，但为了逻辑完整）
                    exitFullscreen();
                }
            });
        }
    }
    
    // 可选：键盘ESC退出全屏时，按钮会通过fullscreenchange事件自动处理
    // 此外确保窗口大小变化也不影响
    
    // ---------- 初始化 ----------
    function init() {
        startClock();                // 启动时钟
        bindFullscreenButton();      // 绑定全屏按钮点击
        setupFullscreenAutoExit();   // 设置全屏状态变化及自动退出全屏监听（点击空白区域退出全屏）
        
        // 额外安全处理：若全屏状态下点击页面任何地方退出全屏，已在setupFullscreenAutoExit中通过监听click完成。
        // 避免多次重复绑定，确保优雅。
    }
    
    // 启动应用
    init();
</script>
</body>
</html>
