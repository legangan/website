<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎮 小游戏· 干脆面</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle at 20% 0%,#1b2233 0%,#0a0c11 55%) fixed;
    color:#e8ecf1;min-height:100vh;padding:24px 16px 48px;
    display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:920px}
  .hero{margin-bottom:26px;text-align:center}
  .hero h1{font-size:clamp(22px,4vw,32px);font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,#69a6ff,#a78bfa,#5ee8a8);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin-top:8px;font-size:14px;color:#77839a}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
  .card{
    background:linear-gradient(160deg,#1c2230,#141821);
    border:1px solid #262e3d;border-radius:16px;padding:20px 18px;cursor:pointer;
    transition:transform .18s,border-color .18s,box-shadow .18s;
    display:flex;flex-direction:column;gap:6px;user-select:none;
  }
  .card:hover{transform:translateY(-4px);border-color:#3d7bff;box-shadow:0 14px 34px -14px #3d7bff88}
  .card:active{transform:translateY(-1px) scale(.99)}
  .card .icon{font-size:34px;line-height:1.1}
  .card .name{font-weight:700;font-size:17px}
  .card .desc{font-size:13px;color:#7f8b9e}
  .stage{display:flex;flex-direction:column;gap:12px;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .stage-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .stage-bar button{
    background:#1c2230;border:1px solid #2c3547;color:#cfd8e6;
    padding:9px 16px;border-radius:10px;font-size:14px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  .stage-bar button:hover{background:#25303f;border-color:#3d7bff;color:#fff}
  .stage-title{font-weight:700;font-size:16px}
  .stage-hint{font-size:13px;color:#7f8b9e;margin-left:auto}
  canvas{
    width:100%;height:auto;display:block;border-radius:16px;background:#0f1115;
    touch-action:none;border:1px solid #232a37;
    box-shadow:0 24px 60px -24px #000;
  }
  .hidden{display:none!important}
  footer{margin-top:34px;text-align:center;font-size:12.5px;color:#4d5769}
  @media(max-width:520px){
    body{padding:16px 10px 32px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
    .card{padding:16px 14px}
    .card .icon{font-size:28px}
    .card .name{font-size:15px}
    .card .desc{font-size:12px}
    .stage-hint{width:100%;margin-left:0}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <h1>🎮 小游戏合集</h1>
    <p>点开即玩</p>
  </header>

  <div id="menu" class="grid">
    <div class="card" data-game="dino">
      <div class="icon">🦖</div>
      <div class="name">恐龙快跑</div>
      <div class="desc">经典跳跃躲避，越跑越快</div>
    </div>
    <div class="card" data-game="flappy">
      <div class="icon">🐤</div>
      <div class="name">像素小鸟</div>
      <div class="desc">拍翅膀，穿过管道</div>
    </div>
    <div class="card" data-game="breakout">
      <div class="icon">🧱</div>
      <div class="name">打砖块</div>
      <div class="desc">反弹小球，打光所有砖块</div>
    </div>
  </div>

  <div id="stage" class="stage hidden">
    <div class="stage-bar">
      <button id="backBtn">← 返回</button>
      <span id="stageTitle" class="stage-title"></span>
      <span id="stageHint" class="stage-hint"></span>
    </div>
    <canvas id="cv"></canvas>
  </div>

  <footer>全部游戏零依赖 · 本地运行 · 支持键盘与触屏</footer>
</div>

<script>
/* ==================================================================
   引擎部分
   ================================================================== */
const CV  = document.getElementById('cv');
const ctx = CV.getContext('2d');
const W = 800, H = 450;

const DPR = Math.min(window.devicePixelRatio || 1, 2);
CV.width  = W * DPR;
CV.height = H * DPR;

const menuEl  = document.getElementById('menu');
const stageEl = document.getElementById('stage');
const titleEl = document.getElementById('stageTitle');
const hintEl  = document.getElementById('stageHint');
const backBtn = document.getElementById('backBtn');

let current = null;
let rafId   = null;
let lastT   = 0;
const keys  = new Set();

/* ---------- 工具函数 ---------- */
function roundRect(x, y, w, h, r) {
  if (r > Math.min(w, h) / 2) r = Math.min(w, h) / 2;
  if (r < 0) r = 0;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand  = (a, b) => a + Math.random() * (b - a);

function getPos(e) {
  const r = CV.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top)  * (H / r.height)
  };
}

/* ---------- 主循环 ---------- */
function loop(t) {
  if (!current) { rafId = null; return; }
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 1 / 30);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  try {
    current.update(dt);
    current.draw(ctx);
  } catch (err) {
    console.error(err);
  }

  rafId = requestAnimationFrame(loop);
}

/* ---------- 打开 / 关闭游戏 ---------- */
function openGame(id) {
   const proto = Games[id];
  if (!proto) return;

  keys.clear();
  current = Object.create(proto);
  current.init();

  titleEl.textContent = proto.title;
  hintEl.textContent  = proto.hint;

  menuEl.classList.add('hidden');
  stageEl.classList.remove('hidden');

  lastT = performance.now();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function closeGame() {
  current = null;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  stageEl.classList.add('hidden');
  menuEl.classList.remove('hidden');
}

/* ---------- 事件绑定 ---------- */
menuEl.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (card) openGame(card.dataset.game);
});
backBtn.addEventListener('click', closeGame);
window.addEventListener('keydown', (e) => {
  if (!current) return;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
    e.preventDefault();
  }
  if (e.repeat) return;
  keys.add(e.key);
  if (current.onKey) current.onKey(e.key, e);
});

window.addEventListener('keyup', (e) => {
  keys.delete(e.key);
  if (current && current.onKeyUp) current.onKeyUp(e.key, e);
});

let pStart = null;
CV.addEventListener('pointerdown', (e) => {
  if (!current) return;
  e.preventDefault();
  const p = getPos(e);
  pStart = p;
  if (current.onDown) current.onDown(p.x, p.y);
});

CV.addEventListener('pointermove', (e) => {
  if (!current || !current.onMove) return;
  const p = getPos(e);
  current.onMove(p.x, p.y);
});

CV.addEventListener('pointerup', (e) => {
  if (!current) return;
  const p = getPos(e);
  if (pStart && current.onSwipe) {
    const dx = p.x - pStart.x;
    const dy = p.y - pStart.y;
    if (Math.abs(dx) > 28 || Math.abs(dy) > 28) {
      if (Math.abs(dx) > Math.abs(dy)) current.onSwipe(dx > 0 ? 'right' : 'left');
      else                              current.onSwipe(dy > 0 ? 'down'  : 'up');
    }
  }
  pStart = null;
  if (current.onUp) current.onUp(p.x, p.y);
});

CV.addEventListener('pointercancel', () => { pStart = null; });

window.addEventListener('keydown', (e) => {
  if (e.key === ' ' && current) e.preventDefault();
}, { passive: false });

/* ==================================================================
   游戏集合
   ================================================================== */
const Games = {};

/* ----------------------------------------------------------------
   1. 恐龙快跑
   ---------------------------------------------------------------- */
Games.dino = {
  title: '🦖 恐龙快跑',
  hint: '空格 / ↑ / 点击屏幕 跳跃 · 躲避仙人掌',

  init() {
    this.groundY = H - 70;
    this.dino = { x: 90, y: this.groundY - 48, w: 44, h: 48, vy: 0, onGround: true };

    this.obstacles = [];

    this.pebbles = [];
    for (let i = 0; i < 24; i++) {
      this.pebbles.push({
        x: Math.random() * W,
        y: this.groundY + 10 + Math.random() * 24,
        w: 5 + Math.random() * 18
      });
    }

    this.clouds = [];
    for (let i = 0; i < 4; i++) {
      this.clouds.push({
        x: Math.random() * W,
        y: 40 + Math.random() * 130,
        s: 0.6 + Math.random() * 0.8
      });
    }

    this.speed    = 380;
    this.dist     = 0;
    this.score    = 0;
    this.runTime  = 0;
    this.spawnT   = 1.1;
    this.dead     = false;
    this.started  = false;
    this.best     = +(localStorage.getItem('mini_dino_best') || 0);
  },

  jump() {
    if (this.dead) {
      const b = this.best;
      this.init();
      this.best = b;
      this.started = true;
      return;
    }
    this.started = true;
    if (this.dino.onGround) {
      this.dino.vy = -830;
      this.dino.onGround = false;
    }
  },

  onKey(k) {
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') this.jump();
    if (k === 'r' || k === 'R') {
      const b = this.best; this.init(); this.best = b; this.started = true;
    }
  },

  onDown() { this.jump(); },

  update(dt) {
    if (this.dead) return;
    if (!this.started) return;

    this.speed = Math.min(920, this.speed + 7 * dt);
    this.runTime += dt;
    this.dist += this.speed * dt;
    this.score = Math.floor(this.dist / 12);
    if (this.score > this.best) this.best = this.score;

    const d = this.dino;
    d.vy += 2500 * dt;
    d.y  += d.vy * dt;
    if (d.y + d.h >= this.groundY) {
      d.y = this.groundY - d.h;
      d.vy = 0;
      d.onGround = true;
    }

    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      const big     = Math.random() < 0.35;
      const ow      = big ? 30 : 20;
      const oh      = big ? 52 : 36;
      const cluster = Math.random() < 0.32 ? 2 : 1;
      this.obstacles.push({
        x: W + 30,
        y: this.groundY - oh,
        w: ow * cluster,
        h: oh
      });
      const gapDist = 300 + Math.random() * 330 + this.speed * 0.35;
      this.spawnT = gapDist / this.speed;
    }

    for (const o of this.obstacles) o.x -= this.speed * dt;
    this.obstacles = this.obstacles.filter(o => o.x + o.w > -40);

    for (const p of this.pebbles) {
      p.x -= this.speed * dt;
      if (p.x < -30) {
        p.x = W + Math.random() * 80;
        p.y = this.groundY + 10 + Math.random() * 24;
      }
    }
    for (const c of this.clouds) {
      c.x -= this.speed * 0.12 * c.s * dt;
      if (c.x < -140) {
        c.x = W + 60 + Math.random() * 240;
        c.y = 40 + Math.random() * 130;
      }
    }

    const hx = d.x + 10, hy = d.y + 8, hw = d.w - 24, hh = d.h - 12;
    for (const o of this.obstacles) {
      if (hx < o.x + o.w && hx + hw > o.x && hy < o.y + o.h && hy + hh > o.y) {
        this.die();
        return;
      }
    }
  },

  die() {
    this.dead = true;
    if (this.score > this.best) this.best = this.score;
    localStorage.setItem('mini_dino_best', this.best);
  },

  drawCactus(o) {
    const trunkW = o.w * 0.58;
    const tx = o.x + (o.w - trunkW) / 2;
    ctx.fillStyle = '#4f9e5e';
    ctx.fillRect(tx, o.y, trunkW, o.h);
    ctx.fillRect(o.x + o.w * 0.02, o.y + o.h * 0.30, o.w * 0.24, o.h * 0.14);
    ctx.fillRect(o.x + o.w * 0.74, o.y + o.h * 0.46, o.w * 0.24, o.h * 0.14);
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(tx + 2, o.y + 3, 3, o.h - 8);
  },
    drawDino() {
    const d = this.dino;
    const x = d.x, y = d.y;
    const body = this.dead ? '#8a5252' : '#e8ecf1';

    ctx.fillStyle = body;
    ctx.fillRect(x - 9, y + 17, 18, 9);
    ctx.fillRect(x + 8, y + 15, 25, 19);
    ctx.fillRect(x + 18, y + 11, 13, 12);
    ctx.fillRect(x + 21, y + 1, 23, 17);
    ctx.fillRect(x + 40, y + 12, 9, 5);
    ctx.fillRect(x + 28, y + 23, 9, 5);

    ctx.fillStyle = '#0f1115';
    ctx.fillRect(x + 35, y + 6, 5, 5);

    const frame = Math.floor(this.runTime * 14) % 2;
    ctx.fillStyle = body;
    if (this.dead) {
      ctx.fillRect(x + 12, y + 33, 7, 15);
      ctx.fillRect(x + 25, y + 33, 7, 15);
    } else if (d.onGround) {
      if (frame === 0) {
        ctx.fillRect(x + 12, y + 33, 7, 15);
        ctx.fillRect(x + 25, y + 33, 7, 9);
      } else {
        ctx.fillRect(x + 12, y + 33, 7, 9);
        ctx.fillRect(x + 25, y + 33, 7, 15);
      }
    } else {
      ctx.fillRect(x + 12, y + 33, 7, 11);
      ctx.fillRect(x + 25, y + 33, 7, 13);
    }

    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    const shadowW = clamp(30 - (this.groundY - (d.y + d.h)) * 0.12, 6, 30);
    ctx.ellipse(x + 22, this.groundY + 3, shadowW * 0.7, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
  },

  draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#12161e');
    g.addColorStop(1, '#0a0c11');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#1c222d';
    for (const c of this.clouds) {
      const s = c.s;
      roundRect(c.x, c.y, 74 * s, 15 * s, 8 * s); ctx.fill();
      roundRect(c.x + 16 * s, c.y - 11 * s, 44 * s, 16 * s, 8 * s); ctx.fill();
    }

    ctx.strokeStyle = '#3a4250';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, this.groundY + 1);
    ctx.lineTo(W, this.groundY + 1);
    ctx.stroke();

    ctx.strokeStyle = '#242b36';
    ctx.lineWidth = 2;
    for (const p of this.pebbles) {
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.w, p.y);
      ctx.stroke();
    }

    for (const o of this.obstacles) this.drawCactus(o);
    this.drawDino();

    ctx.font = 'bold 18px "Courier New",monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#5c6779';
    ctx.fillText('HI ' + String(this.best).padStart(5, '0'), W - 140, 22);
    ctx.fillStyle = '#8b95a5';
    ctx.fillText(String(this.score).padStart(5, '0'), W - 26, 22);

    ctx.textAlign = 'center';
    if (!this.started && !this.dead) {
      ctx.fillStyle = 'rgba(10,12,17,.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#e8ecf1';
      ctx.font = 'bold 30px system-ui,sans-serif';
      ctx.fillText('🦖 恐龙快跑', W / 2, H / 2 - 60);
      ctx.fillStyle = '#8b95a5';
      ctx.font = '17px system-ui,sans-serif';
      ctx.fillText('按 空格 / 点击屏幕 开始奔跑', W / 2, H / 2 - 10);
    }

    if (this.dead) {
      ctx.fillStyle = 'rgba(8,10,14,.72)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff8a8a';
      ctx.font = 'bold 42px system-ui,sans-serif';
      ctx.fillText('游戏结束', W / 2, H / 2 - 62);
      ctx.fillStyle = '#e8ecf1';
      ctx.font = 'bold 24px system-ui,sans-serif';
      ctx.fillText('本次分数 ' + this.score, W / 2, H / 2 - 8);
      ctx.fillStyle = '#8b95a5';
      ctx.font = '17px system-ui,sans-serif';
      ctx.fillText('最高纪录 ' + this.best, W / 2, H / 2 + 30);
      ctx.fillStyle = '#6b7684';
      ctx.font = '15px system-ui,sans-serif';
      ctx.fillText('按 空格 / 点击屏幕 重新开始', W / 2, H / 2 + 78);
    }
  }
};

/* ----------------------------------------------------------------
   2. 像素小鸟
   ---------------------------------------------------------------- */
Games.flappy = {
  title: '🐤 像素小鸟',
  hint: '空格 / ↑ / 点击屏幕 拍翅膀',

  init() {
    this.groundY = H - 62;
    this.bird = { x: 170, y: H / 2 - 40, vy: 0, r: 15, rot: 0 };
    this.pipes = [];
    this.gapH = 152;
    this.speed = 215;
    this.spawnT = 1.6;
    this.score = 0;
    this.best = +(localStorage.getItem('mini_flappy_best') || 0);
    this.dead = false;
    this.started = false;
    this.t = 0;
    this.wingT = 0;
    this.clouds = [];
    for (let i = 0; i < 5; i++) {
      this.clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 160, s: 0.5 + Math.random() * 0.9 });
    }
  },

  flap() {
    if (this.dead) {
      const b = this.best;
      this.init();
      this.best = b;
      this.started = true;
      this.bird.vy = -430;
      return;
    }
    this.started = true;
    this.bird.vy = -430;
    this.wingT = 0.12;
  },

  onKey(k) {
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') this.flap();
    if (k === 'r' || k === 'R') { const b = this.best; this.init(); this.best = b; }
  },

  onDown() { this.flap(); },

  update(dt) {
    this.t += dt;
    if (this.wingT > 0) this.wingT -= dt;

    for (const c of this.clouds) {
      c.x -= 24 * c.s * dt;
      if (c.x < -120) { c.x = W + 60 + Math.random() * 200; c.y = 30 + Math.random() * 160; }
    }

    if (this.dead) {
      const b = this.bird;
      b.vy += 1800 * dt;
      b.y += b.vy * dt;
      if (b.y + b.r > this.groundY) { b.y = this.groundY - b.r; b.vy = 0; }
      b.rot = Math.min(Math.PI / 2, b.rot + 4 * dt);
      return;
    }

    if (!this.started) {
      this.bird.y = H / 2 - 40 + Math.sin(this.t * 3) * 9;
      return;
    }

    const b = this.bird;
    b.vy += 1600 * dt;
    b.y += b.vy * dt;
    b.rot = clamp(b.vy / 900, -0.45, 1.2);

    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      const minTop = 46;
      const maxTop = this.groundY - this.gapH - 46;
      const top = rand(minTop, maxTop);
      this.pipes.push({ x: W + 30, top, w: 70, passed: false });
      this.spawnT = 1.5;
    }

    for (const p of this.pipes) p.x -= this.speed * dt;
    this.pipes = this.pipes.filter(p => p.x + p.w > -30);
        for (const p of this.pipes) {
      if (this.circleRect(b.x, b.y, b.r - 2, p.x, 0, p.w, p.top)) return this.die();
      const by = p.top + this.gapH;
      if (this.circleRect(b.x, b.y, b.r - 2, p.x, by, p.w, this.groundY - by)) return this.die();

      if (!p.passed && p.x + p.w < b.x) {
        p.passed = true;
        this.score++;
      }
    }

    if (b.y + b.r > this.groundY) { b.y = this.groundY - b.r; return this.die(); }
    if (b.y - b.r < 0) { b.y = b.r; b.vy = 0; }
  },

  circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = clamp(cx, rx, rx + rw);
    const ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  },

  die() {
    if (this.dead) return;
    this.dead = true;
    if (this.score > this.best) {
      this.best = this.score;
      localStorage.setItem('mini_flappy_best', this.best);
    }
  },

  draw() {
    const g = ctx.createLinearGradient(0, 0, 0, this.groundY);
    g.addColorStop(0, '#1b2c4a');
    g.addColorStop(0.6, '#27405f');
    g.addColorStop(1, '#33526e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, this.groundY);

    ctx.fillStyle = 'rgba(255,255,255,.07)';
    for (const c of this.clouds) {
      const s = c.s;
      roundRect(c.x, c.y, 80 * s, 16 * s, 8 * s); ctx.fill();
      roundRect(c.x + 18 * s, c.y - 12 * s, 46 * s, 17 * s, 9 * s); ctx.fill();
    }

    for (const p of this.pipes) {
      const by = p.top + this.gapH;
      this.drawPipe(p.x, 0, p.w, p.top, true);
      this.drawPipe(p.x, by, p.w, this.groundY - by, false);
    }

    ctx.fillStyle = '#2e3a2c';
    ctx.fillRect(0, this.groundY, W, H - this.groundY);
    ctx.fillStyle = '#3f5238';
    ctx.fillRect(0, this.groundY, W, 8);

    this.drawBird();

    ctx.font = 'bold 46px "Courier New",monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.strokeStyle = 'rgba(0,0,0,.45)';
    ctx.lineWidth = 5;
    ctx.strokeText(String(this.score), W / 2, 30);
    ctx.fillText(String(this.score), W / 2, 30);

    ctx.font = 'bold 14px "Courier New",monospace';
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillText('BEST ' + this.best, W / 2, 88);

    if (!this.started && !this.dead) {
      ctx.fillStyle = 'rgba(8,10,14,.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#e8ecf1';
      ctx.font = 'bold 30px system-ui,sans-serif';
      ctx.fillText('🐤 像素小鸟', W / 2, H / 2 - 70);
      ctx.fillStyle = '#8b95a5';
      ctx.font = '17px system-ui,sans-serif';
      ctx.fillText('按 空格 / 点击屏幕 拍动翅膀', W / 2, H / 2 - 16);
      ctx.fillStyle = '#6b7684';
      ctx.font = '14px system-ui,sans-serif';
      ctx.fillText('穿过管道，别撞上去', W / 2, H / 2 + 22);
    }

    if (this.dead) {
      ctx.fillStyle = 'rgba(8,10,14,.7)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff8a8a';
      ctx.font = 'bold 42px system-ui,sans-serif';
      ctx.fillText('撞上了！', W / 2, H / 2 - 58);
      ctx.fillStyle = '#e8ecf1';
      ctx.font = 'bold 24px system-ui,sans-serif';
      ctx.fillText('得分 ' + this.score + ' · 最高 ' + this.best, W / 2, H / 2 + 2);
      ctx.fillStyle = '#6b7684';
      ctx.font = '16px system-ui,sans-serif';
      ctx.fillText('按 空格 / 点击屏幕 重新开始', W / 2, H / 2 + 56);
    }
  },

  drawPipe(x, y, w, h, isTop) {
    if (h <= 0) return;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#4a9e4a');
    g.addColorStop(0.35, '#6ec46e');
    g.addColorStop(1, '#3b7d3b');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);

    const capH = 22;
    const capY = isTop ? y + h - capH : y;
    ctx.fillStyle = '#5cb85c';
    ctx.fillRect(x - 5, capY, w + 10, capH);
    ctx.strokeStyle = 'rgba(0,0,0,.28)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 5, capY, w + 10, capH);
    ctx.strokeRect(x, y, w, h);
  },

  drawBird() {
    const b = this.bird;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);

    const g = ctx.createRadialGradient(-4, -4, 2, 0, 0, b.r + 6);
    g.addColorStop(0, '#ffe27a');
    g.addColorStop(1, '#f2b93c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, Math.PI * 2);
    ctx.fill();

    const wingUp = this.wingT > 0;
    ctx.fillStyle = '#fff3c4';
    ctx.beginPath();
    if (wingUp) ctx.ellipse(-4, -4, 9, 6, -0.5, 0, Math.PI * 2);
    else        ctx.ellipse(-4, 5, 9, 6, 0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(6, -5, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#101216';
    ctx.beginPath();
    ctx.arc(8, -5, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff8c32';
    ctx.beginPath();
    ctx.moveTo(12, -1);
    ctx.lineTo(24, 3);
    ctx.lineTo(12, 8);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }
};

/* ----------------------------------------------------------------
   3. 打砖块
   ---------------------------------------------------------------- */
Games.breakout = {
  title: '🧱 打砖块',
  hint: '← → 或移动鼠标 控制挡板 · 空格 发射',

  init() {
    this.paddle = { w: 120, h: 14, x: W / 2 - 60, y: H - 46 };
    this.ballR = 8;
    this.ball = { x: W / 2, y: this.paddle.y - 20, vx: 0, vy: 0 };
    this.lives = 3;
    this.score = 0;
    this.best = +(localStorage.getItem('mini_breakout_best') || 0);
    this.state = 'ready';
    this.flash = 0;

    this.bricks = [];
    const cols = 10, rows = 5, bw = 64, bh = 22, gx = 8, gy = 10;
    const totalW = cols * bw + (cols - 1) * gx;
    const ox = (W - totalW) / 2;
    const oy = 62;
    const colors = ['#f65e5e', '#f6a23c', '#f6e05e', '#5ee08a', '#5ec8f6'];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        this.bricks.push({
          x: ox + c * (bw + gx),
          y: oy + r * (bh + gy),
          w: bw, h: bh,
          alive: true,
          color: colors[r]
        });
      }
    }
  },

  launch() {
    if (this.state !== 'ready') return;
      const a = rand(-0.38, 0.38);
  const sp = 420;
  this.ball.vx = Math.sin(a) * sp;
  this.ball.vy = -Math.cos(a) * sp;
  this.state = 'playing';
},

resetBall() {
  this.ball.x = this.paddle.x + this.paddle.w / 2;
  this.ball.y = this.paddle.y - this.ballR - 4;
  this.ball.vx = 0;
  this.ball.vy = 0;
  this.state = 'ready';
},

onKey(k) {
  if (k === ' ') {
    if (this.state === 'ready') this.launch();
    else if (this.state === 'over' || this.state === 'win') this.init();
  }
  if ((k === 'r' || k === 'R') && (this.state === 'over' || this.state === 'win')) this.init();
},

onDown() {
  if (this.state === 'ready') this.launch();
  else if (this.state === 'over' || this.state === 'win') this.init();
},

onMove(x) {
  if (this.state === 'over' || this.state === 'win') return;
  this.paddle.x = clamp(x - this.paddle.w / 2, 0, W - this.paddle.w);
},

update(dt) {
  if (this.flash > 0) this.flash -= dt;
  if (this.state === 'over' || this.state === 'win') return;

  const sp = 720;
  if (keys.has('ArrowLeft') || keys.has('a') || keys.has('A'))  this.paddle.x -= sp * dt;
  if (keys.has('ArrowRight') || keys.has('d') || keys.has('D')) this.paddle.x += sp * dt;
  this.paddle.x = clamp(this.paddle.x, 0, W - this.paddle.w);

  const b = this.ball;

  if (this.state === 'ready') {
    b.x = this.paddle.x + this.paddle.w / 2;
    b.y = this.paddle.y - this.ballR - 4;
    return;
  }

  const speed = Math.hypot(b.vx, b.vy);
  const steps = Math.max(1, Math.ceil(speed * dt / 5));
  const sdt = dt / steps;
  for (let i = 0; i < steps; i++) {
    this.stepBall(sdt);
    if (this.state !== 'playing') break;
  }
},

stepBall(dt) {
  const b = this.ball;
  const r = this.ballR;
  const p = this.paddle;

  b.x += b.vx * dt;
  b.y += b.vy * dt;

  if (b.x - r < 0)     { b.x = r;     b.vx = Math.abs(b.vx); }
  if (b.x + r > W)     { b.x = W - r; b.vx = -Math.abs(b.vx); }
  if (b.y - r < 0)     { b.y = r;     b.vy = Math.abs(b.vy); }

  if (b.vy > 0 &&
      b.y + r >= p.y && b.y - r <= p.y + p.h &&
      b.x + r >= p.x && b.x - r <= p.x + p.w) {
    const rel = clamp((b.x - (p.x + p.w / 2)) / (p.w / 2), -1, 1);
    const ang = rel * 1.05;
    let sp = Math.min(760, Math.hypot(b.vx, b.vy) * 1.015);
    b.vx = Math.sin(ang) * sp;
    b.vy = -Math.abs(Math.cos(ang) * sp);
    b.y = p.y - r - 0.5;
  }

  for (const br of this.bricks) {
    if (!br.alive) continue;
    if (b.x + r > br.x && b.x - r < br.x + br.w &&
        b.y + r > br.y && b.y - r < br.y + br.h) {
      br.alive = false;
      this.score += 10;
      this.flash = 0.08;

      const ovX = Math.min(b.x + r - br.x, br.x + br.w - (b.x - r));
      const ovY = Math.min(b.y + r - br.y, br.y + br.h - (b.y - r));
      if (ovX < ovY) b.vx = -b.vx;
      else           b.vy = -b.vy;
      break;
    }
  }

  if (b.y - r > H) {
    this.lives--;
    if (this.lives <= 0) {
      this.state = 'over';
      if (this.score > this.best) {
        this.best = this.score;
        localStorage.setItem('mini_breakout_best', this.best);
      }
    } else {
      this.resetBall();
    }
    return;
  }

  if (this.bricks.every(br => !br.alive)) {
    this.state = 'win';
    this.score += 200;
    if (this.score > this.best) {
      this.best = this.score;
      localStorage.setItem('mini_breakout_best', this.best);
    }
  }
},

draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#101420');
  g.addColorStop(1, '#0a0c11');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (this.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(0, 0, W, H);
  }

  for (const br of this.bricks) {
    if (!br.alive) continue;
    ctx.fillStyle = br.color;
    roundRect(br.x, br.y, br.w, br.h, 5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    roundRect(br.x + 3, br.y + 3, br.w - 6, br.h * 0.28, 3);
    ctx.fill();
  }

  const p = this.paddle;
  const pg = ctx.createLinearGradient(p.x, 0, p.x + p.w, 0);
  pg.addColorStop(0, '#5b8cff');
  pg.addColorStop(1, '#8ad2ff');
  ctx.fillStyle = pg;
  roundRect(p.x, p.y, p.w, p.h, 7);
  ctx.fill();

  const b = this.ball;
  ctx.save();
  ctx.shadowColor = '#8ad2ff';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#eaf4ff';
  ctx.beginPath();
  ctx.arc(b.x, b.y, this.ballR, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.font = 'bold 17px "Courier New",monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#8ad2ff';
  ctx.fillText('得分 ' + this.score, 18, 16);
  ctx.fillStyle = '#5c6779';
  ctx.fillText('最高 ' + this.best, 140, 16);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff6b7a';
  let hearts = '';
  for (let i = 0; i < Math.max(0, this.lives); i++) hearts += '♥ ';
  ctx.fillText(hearts.trim() || '—', W - 18, 16);
      if (this.state === 'ready') {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#8b95a5';
      ctx.font = 'bold 20px system-ui,sans-serif';
      ctx.fillText('按 空格 / 点击屏幕 发射小球', W / 2, H / 2 + 70);
    }

    if (this.state === 'over' || this.state === 'win') {
      ctx.fillStyle = 'rgba(8,10,14,.78)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = this.state === 'win' ? '#7ee787' : '#ff8a8a';
      ctx.font = 'bold 44px system-ui,sans-serif';
      ctx.fillText(this.state === 'win' ? '🎉 全部击碎！' : '游戏结束', W / 2, H / 2 - 56);
      ctx.fillStyle = '#e8ecf1';
      ctx.font = 'bold 24px system-ui,sans-serif';
      ctx.fillText('得分 ' + this.score + ' · 最高 ' + this.best, W / 2, H / 2 + 4);
      ctx.fillStyle = '#6b7684';
      ctx.font = '16px system-ui,sans-serif';
      ctx.fillText('按 空格 / 点击屏幕 再玩一次', W / 2, H / 2 + 58);
    }
  }
};

/* ==================================================================
   启动
   ================================================================== */
window.addEventListener('load', () => {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
});
</script>
